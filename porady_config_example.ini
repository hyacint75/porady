[data]
; Zkopirujte tento soubor jako porady_config.ini vedle EXE.
; Bez konfigurace aplikace uklada porady.db vedle EXE a zalohy do slozky backups.
; Pro centralni data na sitovem disku nastavte bud spolecnou slozku:
; data_dir=\\server\sdilene\Porady

; Nebo nastavte konkretni cestu k databazi a volitelne i zaloham:
; database_path=\\server\sdilene\Porady\porady.db
; backup_dir_path=\\server\sdilene\Porady\backups

[security]
; Nastavte vlastni admin heslo. Bez hesla zustane aplikace jen pro cteni.
; Alternativne lze heslo nastavit promenou prostredi PORADY_ADMIN_PASSWORD.
admin_password=zmente-toto-heslo
